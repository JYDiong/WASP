<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WASP &mdash; Tag &amp; Track (3-Hourly Squall Trajectories)</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-hover: #26354d;
      --border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-track: #10b981;
      --accent-track-soft: rgba(16, 185, 129, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #1e293b 0%, var(--bg) 65%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 32px 20px 24px;
      text-align: center;
      border-bottom: 1px solid rgba(148, 163, 184, 0.15);
    }

    .nav-top {
      max-width: 1120px;
      margin: 0 auto 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 8px;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid var(--border);
      transition: color 0.2s ease, border-color 0.2s ease;
    }

    .back-link:hover {
      color: var(--text-main);
      border-color: var(--accent-track);
    }

    .product-pill {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--accent-track);
      background: var(--accent-track-soft);
      border: 1px solid rgba(16, 185, 129, 0.35);
      padding: 5px 12px;
      border-radius: 999px;
    }

    .badge-row {
      display: inline-flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 10px;
      background: rgba(15, 23, 42, 0.82);
      border: 1px solid var(--border);
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 10px;
      max-width: 100%;
    }

    .astro-bar {
      display: inline-flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 14px;
      background: rgba(30, 41, 59, 0.65);
      border: 1px solid rgba(51, 65, 85, 0.85);
      padding: 7px 18px;
      border-radius: 12px;
      font-size: 0.79rem;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .astro-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .astro-item strong {
      color: var(--text-main);
      font-weight: 600;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }

    header h1 {
      margin: 0;
      font-size: clamp(1.9rem, 4vw, 2.7rem);
      letter-spacing: 4px;
      font-weight: 800;
      background: linear-gradient(90deg, #34d399, #f8fafc 50%, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header .quote {
      margin: 10px auto 0;
      max-width: 620px;
      font-size: 0.86rem;
      font-style: italic;
      color: #cbd5e1;
      opacity: 0.85;
    }

    header .quote span {
      font-style: normal;
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    main {
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      padding: 28px 20px 48px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 18px;
    }

    .btn-group {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      background: #0f172a;
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    button:hover {
      border-color: var(--accent-track);
      background: var(--surface-hover);
    }

    button.active {
      background: var(--accent-track);
      color: #06281e;
      border-color: var(--accent-track);
    }

    .slider-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 240px;
    }

    input[type="range"] {
      flex: 1;
      accent-color: var(--accent-track);
      cursor: pointer;
    }

    .step-badge {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent-track);
      background: #0f172a;
      border: 1px solid var(--border);
      padding: 5px 10px;
      border-radius: 6px;
      min-width: 112px;
      text-align: center;
    }

    .map-frame {
      position: relative;
      width: 100%;
      background: #0b1120;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 360px;
    }

    .map-frame img {
      width: 100%;
      max-height: 760px;
      object-fit: contain;
      display: block;
    }

    .fallback-msg {
      display: none;
      padding: 40px 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.92rem;
    }

    .table-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .table-header h2 {
      margin: 0;
      font-size: 1.1rem;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      text-align: left;
    }

      color: var(--text-muted);
      font-weight: 600;
      padding: 10px 1
